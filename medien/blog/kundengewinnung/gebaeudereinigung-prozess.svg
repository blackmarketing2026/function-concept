<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img"><title>Vom Bedarf zum Reinigungsvertrag</title><rect width="1200" height="600" rx="24" fill="#eef4ff"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#14213d">Vom Bedarf zum Reinigungsvertrag</text><rect x="60" y="130" width="525" height="175" rx="18" fill="white" stroke="#c5d6f1"/><rect x="60" y="154" width="6" height="110" fill="#1552bd"/><text x="88" y="195" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#14213d">01 · Suchanfrage</text><text x="88" y="244" font-family="Arial,sans-serif" font-size="25" fill="#374151">Leistung und Einsatzort</text><rect x="615" y="130" width="525" height="175" rx="18" fill="white" stroke="#c5d6f1"/><rect x="615" y="154" width="6" height="110" fill="#1552bd"/><text x="643" y="195" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#14213d">02 · Objekt prüfen</text><text x="643" y="244" font-family="Arial,sans-serif" font-size="25" fill="#374151">Art, Turnus und Kapazität</text><rect x="60" y="340" width="525" height="175" rx="18" fill="white" stroke="#c5d6f1"/><rect x="60" y="364" width="6" height="110" fill="#1552bd"/><text x="88" y="405" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#14213d">03 · Besichtigung</text><text x="88" y="454" font-family="Arial,sans-serif" font-size="25" fill="#374151">Umfang und Angebot</text><rect x="615" y="340" width="525" height="175" rx="18" fill="white" stroke="#c5d6f1"/><rect x="615" y="364" width="6" height="110" fill="#1552bd"/><text x="643" y="405" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#14213d">04 · Entscheidung</text><text x="643" y="454" font-family="Arial,sans-serif" font-size="25" fill="#374151">Vertrag oder Absage</text></svg>