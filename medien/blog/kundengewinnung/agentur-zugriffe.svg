<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Übergabe mit klaren Zuständigkeiten</title><rect width="1200" height="600" rx="24" fill="#eef4ff"/><text x="50" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#14213d">Übergabe mit klaren Zuständigkeiten</text><rect x="50" y="135" width="530" height="170" rx="16" fill="#fff" stroke="#c5d6f1"/><text x="75" y="195" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1552bd">Inventar</text><text x="75" y="245" font-family="Arial,sans-serif" font-size="26" fill="#374151">Konten und Ressourcen</text><rect x="610" y="135" width="530" height="170" rx="16" fill="#fff" stroke="#c5d6f1"/><text x="635" y="195" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1552bd">Rollen</text><text x="635" y="245" font-family="Arial,sans-serif" font-size="26" fill="#374151">Passende Rechte festlegen</text><rect x="50" y="345" width="530" height="170" rx="16" fill="#fff" stroke="#c5d6f1"/><text x="75" y="405" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1552bd">Übernahme</text><text x="75" y="455" font-family="Arial,sans-serif" font-size="26" fill="#374151">Zugriff bestätigen</text><rect x="610" y="345" width="530" height="170" rx="16" fill="#fff" stroke="#c5d6f1"/><text x="635" y="405" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1552bd">Abschluss</text><text x="635" y="455" font-family="Arial,sans-serif" font-size="26" fill="#374151">Alte Zugriffe prüfen</text></svg>